name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
    inputs:
      upload-pages:
        description: Upload dist/ as the GitHub Pages artifact
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - uses: biomejs/setup-biome@v2
        with:
          version: 2.6.5

      - name: Lint and format check
        run: biome check .

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Check the Pages fallback was emitted
        run: test -f dist/404.html

      - name: Upload the Pages artifact
        if: inputs.upload-pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
