<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title><%= appTitle %></title>
    <link rel="icon" type="image/svg+xml" href="<%= publicPath %>public/favicon.svg" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="<%= groundLight %>" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="<%= groundDark %>" />
    <meta
      name="description"
      content="<%= appDescription %>"
    />
    <script>
      (() => {
        try {
          const saved = JSON.parse(localStorage.getItem("dgt-exam-webapp") || "{}");
          const theme = saved?.state?.settings?.theme || "system";
          if (
            theme === "dark" ||
            (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark");
          }
        } catch {}
      })();
    </script>
  </head>
  <body>
    <noscript>
      <div
        style="
          max-width: 65ch;
          margin: 0 auto;
          padding: 4rem 1rem;
          font-family: ui-sans-serif, system-ui, sans-serif;
          line-height: 1.5;
        "
      >
        <h1 style="font-size: 1.5rem; margin: 0 0 1rem"><%= noscriptTitle %></h1>
        <p style="margin: 0 0 0.5rem">
          <%= noscriptBody %>
        </p>
        <p style="margin: 0; color: var(--ink-dim)">
          <%= noscriptHint %>
        </p>
      </div>
    </noscript>
    <div id="root"></div>
  </body>
</html>
