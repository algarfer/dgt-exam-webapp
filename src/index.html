<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DGT Tests</title>
    <meta
      name="description"
      content="Aplicacion para la resolucion de examenes de conducir (DGT)"
    />
    <script>
      (() => {
        try {
          const saved = JSON.parse(localStorage.getItem("dgt-exam-webapp") || "{}");
          const theme = saved?.state?.settings?.theme || "system";
          if (
            theme === "dark" ||
            (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark");
          }
        } catch {}
      })();
    </script>
  </head>
  <body>
    <noscript>
      <div
        style="
          max-width: 65ch;
          margin: 0 auto;
          padding: 4rem 1rem;
          font-family: ui-sans-serif, system-ui, sans-serif;
          line-height: 1.5;
        "
      >
        <h1 style="font-size: 1.5rem; margin: 0 0 1rem">Necesitas JavaScript</h1>
        <p style="margin: 0 0 0.5rem">
          Esta aplicación te ayuda a preparar el examen teorico de la DGT.
          Para su correcto funcionamiento es necesario tener habilitado JavaScript.
        </p>
        <p style="margin: 0; color: #5a5d55">
          Actívalo para los dominios de esta web y vuelve a cargar la página.
        </p>
      </div>
    </noscript>
    <div id="root"></div>
  </body>
</html>
